<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Gyro Holo Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one-screen viewer, card centered, controls docked below */
:root{
  --bg:#120f1a; --panel:#1d1828; --line:#352c47; --fg:#f4eefb; --mute:#a99cbf; --accent:#ff4fa3; --cyan:#3fe0f0;
  --display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;max-width:560px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.status{font-size:.75rem;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:900px;position:relative}
.card{position:relative;height:100%;max-width:100%;aspect-ratio:var(--ar,0.5714);border-radius:14px;overflow:hidden;transform-style:preserve-3d;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);will-change:transform;background:#000}
.card canvas{width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(18,15,26,.72);backdrop-filter:blur(6px);color:var(--fg);font-size:.8rem;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.controls{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1a0612}
button,label.btn{font:inherit;font-size:.82rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button.primary{background:var(--cyan);border-color:var(--cyan);color:#06222a;font-weight:700}
label.slider{display:flex;white-space:nowrap;align-items:center;gap:8px;font-size:.8rem;color:var(--mute);flex:1;min-width:140px}
label.slider input{flex:1;accent-color:var(--accent)}
.small{font-size:.72rem;color:var(--mute);line-height:1.5}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>

<div class="app">
  <header>
    <h1>Gyro <span>Holo</span> Card</h1>
    <div class="status" id="status">拖曳卡片試試看</div>
  </header>
  <div class="stage" id="stage">
    <div class="card" id="card"><canvas id="gl"></canvas><div class="hint" id="hint">傾斜手機或拖曳卡片</div></div>
  </div>
  <div class="controls">
    <div class="row">
      <div class="seg" role="group" aria-label="模式">
        <button id="mDepth" aria-pressed="true">深度閃卡</button>
        <button id="mOrbit" aria-pressed="false">環繞影格</button>
      </div>
      <button class="primary" id="gyroBtn">啟用陀螺儀</button>
      <button id="recal">歸零</button>
    </div>
    <div class="row" id="depthRow">
      <label class="slider">立體 <input id="str" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label class="slider">閃光 <input id="foil" type="range" min="0" max="1" step="0.05" value="0.55"></label>
    </div>
    <div class="row" id="orbitRow" hidden>
      <label class="btn">選擇 360° 環繞影片<input id="vid" type="file" accept="video/*"></label>
      <label class="btn">換圖片<input id="imgIn" type="file" accept="image/*"></label>
      <span class="small" id="orbitInfo">放入 AI 生成的單向環繞影片，傾斜或左右滑動就會轉動角色。</span>
    </div>
  </div>
</div>

const $ = id => document.getElementById(id);
const canvas = $("gl"), card = $("card"), statusEl = $("status"), hint = $("hint");
const gl = canvas.getContext("webgl", {premultipliedAlpha:false, antialias:false});

// ---------- WebGL depth parallax + holo foil ----------
const VS = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; uv.y = 1.0-uv.y; gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float;
varying vec2 uv;
uniform sampler2D img, dep;
uniform vec2 tilt; uniform float strength, foil, mode, time;
float D(vec2 t){ return texture2D(dep,t).r; }
void main(){
  vec2 t = uv;
  vec4 c;
  if(mode < 0.5){
    vec2 shift = tilt * 0.045 * strength;
    vec2 base = (uv-0.5)/1.08 + 0.5;          // zoom a touch to hide edges
    vec2 s = base;
    for(int i=0;i<10;i++){ s = base - shift*(D(s)-0.45); }
    t = clamp(s, 0.001, 0.999);
  }
  c = texture2D(img, t);
  // holographic foil: rainbow bands that slide with tilt, stronger on bright areas
  float lum = dot(c.rgb, vec3(.299,.587,.114));
  float h = fract(uv.x*0.9 + uv.y*1.4 + tilt.x*0.55 - tilt.y*0.35);
  vec3 rainbow = 0.5 + 0.5*cos(6.2831*(h + vec3(0.0,0.33,0.67)));
  float bands = 0.55 + 0.45*sin((uv.x+uv.y)*38.0 + tilt.x*6.0);
  float sparkle = step(0.985, fract(sin(dot(floor(uv*vec2(160.,280.)), vec2(12.9898,78.233)))*43758.5453 + tilt.x*0.8 + tilt.y*0.6));
  float m = foil * (0.18 + 0.5*smoothstep(0.45,0.95,lum)) * bands;
  c.rgb = mix(c.rgb, c.rgb + rainbow*0.55, m);
  c.rgb += sparkle * foil * 0.9 * smoothstep(0.3,0.8,lum);
  // glare that follows the light
  vec2 lp = vec2(0.5) - tilt*vec2(0.55,0.45);
  float g = exp(-6.0*dot(uv-lp, uv-lp));
  c.rgb += g * (0.10 + 0.25*foil);
  gl_FragColor = vec4(c.rgb, 1.0);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const uTilt=U("tilt"), uStr=U("strength"), uFoil=U("foil"), uMode=U("mode");
gl.uniform1i(U("img"),0); gl.uniform1i(U("dep"),1);
function tex(unit){ const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
const imgTex = tex(0), depTex = tex(1);
function upload(t, unit, src){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src); }
function loadImg(src){ return new Promise((res,rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }

let cardImage = null;
Promise.all([loadImg(IMG_SRC), loadImg(DEPTH_SRC)]).then(([a,b])=>{ cardImage=a; upload(imgTex,0,a); upload(depTex,1,b); setAspect(a.width/a.height); });

function setAspect(ar){ card.style.setProperty("--ar", ar); requestAnimationFrame(resize); }
function resize(){ const r = card.getBoundingClientRect(), d = Math.min(devicePixelRatio||1, 2);
  canvas.width = Math.round(r.width*d); canvas.height = Math.round(r.height*d); gl.viewport(0,0,canvas.width,canvas.height); }
addEventListener("resize", resize);

// ---------- input: gyro + drag ----------
const st = { mode:"depth", gyro:{x:0,y:0}, base:null, raw:null, drag:{x:0,y:0}, dragging:false, tilt:{x:0,y:0}, orbitPos:0 };
let lastPt = null, gyroOn = false;

function onOrient(e){
  if(e.gamma == null) return;
  st.raw = {g:e.gamma, b:e.beta};
  if(!st.base) st.base = {...st.raw};
  const clamp = v => Math.max(-1.4, Math.min(1.4, v));
  st.gyro.x = clamp((e.gamma - st.base.g)/22);
  st.gyro.y = clamp((e.beta - st.base.b)/22);
  if(!gyroOn){ gyroOn = true; statusEl.textContent = "陀螺儀已啟用"; $("gyroBtn").hidden = true; fadeHint(); }
}
$("gyroBtn").onclick = async () => {
  try{
    if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
      const r = await DeviceOrientationEvent.requestPermission();
      if(r !== "granted"){ statusEl.textContent = "未允許動作感測，可改用拖曳"; return; }
    }
    addEventListener("deviceorientation", onOrient);
    statusEl.textContent = "等待感測器…";
    setTimeout(()=>{ if(!gyroOn) statusEl.textContent = "這裡讀不到陀螺儀，請用拖曳"; }, 1500);
  }catch(err){ statusEl.textContent = "這裡讀不到陀螺儀，請用拖曳"; }
};
$("recal").onclick = () => { st.base = st.raw ? {...st.raw} : null; st.drag = {x:0,y:0}; };

card.addEventListener("pointerdown", e => { st.dragging = true; lastPt = {x:e.clientX, y:e.clientY}; card.setPointerCapture(e.pointerId); fadeHint(); });
card.addEventListener("pointermove", e => {
  if(!st.dragging) return;
  const r = card.getBoundingClientRect(), dx = (e.clientX-lastPt.x)/r.width, dy = (e.clientY-lastPt.y)/r.height;
  lastPt = {x:e.clientX, y:e.clientY};
  if(st.mode === "orbit"){ st.orbitPos -= dx * 1.2; }                    // swipe = keep rotating
  else { st.drag.x = Math.max(-1.8, Math.min(1.8, st.drag.x + dx*3.2)); st.drag.y = Math.max(-1.8, Math.min(1.8, st.drag.y + dy*3.2)); }
});
const end = () => { st.dragging = false; };
card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
function fadeHint(){ hint.style.opacity = 0; }

// ---------- orbit (frame scrub) mode ----------
let frames = [], fctx = null;
const fcanvas = document.createElement("canvas");
$("vid").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.src = URL.createObjectURL(f);
  await new Promise(r => v.onloadeddata = r);
  const N = 72, maxW = 720, sc = Math.min(1, maxW / v.videoWidth);
  const out = [];
  for(let i=0;i<N;i++){
    v.currentTime = v.duration * i / N;
    await new Promise(r => v.onseeked = r);
    const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth*sc); c.height = Math.round(v.videoHeight*sc);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height); out.push(c);
    $("orbitInfo").textContent = `擷取影格 ${i+1}/${N}`;
  }
  frames = out; setAspect(out[0].width/out[0].height);
  $("orbitInfo").textContent = `已載入 ${N} 格。傾斜手機會前後游移，左右滑動可整圈旋轉。`;
};
$("imgIn").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const i = await loadImg(URL.createObjectURL(f)); cardImage = i; upload(imgTex,0,i);
  const flat = document.createElement("canvas"); flat.width = flat.height = 2; const x = flat.getContext("2d"); x.fillStyle="#737373"; x.fillRect(0,0,2,2);
  upload(depTex,1,flat); setAspect(i.width/i.height);
  $("orbitInfo").textContent = "新圖片沒有深度圖，深度閃卡只剩卡片傾斜與閃光。";
};

function setMode(m){
  st.mode = m; $("mDepth").setAttribute("aria-pressed", m==="depth"); $("mOrbit").setAttribute("aria-pressed", m==="orbit");
  $("depthRow").hidden = m!=="depth"; $("orbitRow").hidden = m!=="orbit";
  if(m==="depth" && cardImage){ upload(imgTex,0,cardImage); setAspect(cardImage.width/cardImage.height); }
  if(m==="orbit" && frames.length) setAspect(frames[0].width/frames[0].height);
}
$("mDepth").onclick = () => setMode("depth"); $("mOrbit").onclick = () => setMode("orbit");

// ---------- loop ----------
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastFrame = -1;
function loop(){
  if(!st.dragging && st.mode==="depth"){ st.drag.x *= 0.9; st.drag.y *= 0.9; }   // spring back like a card
  const tx = st.gyro.x + st.drag.x, ty = st.gyro.y + st.drag.y;
  const k = reduce ? 1 : 0.18;
  st.tilt.x += (tx - st.tilt.x)*k; st.tilt.y += (ty - st.tilt.y)*k;

  let rx = -st.tilt.y*10, ry = st.tilt.x*14;
  if(st.mode==="orbit"){ rx *= 0.3; ry *= 0.3; }
  card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;

  if(st.mode==="orbit" && frames.length){
    const N = frames.length;
    const pos = st.orbitPos + st.tilt.x * 0.12;          // tilt sways ±~45°, swipe turns all the way
    const idx = ((Math.round(pos*N) % N) + N) % N;
    if(idx !== lastFrame){ upload(imgTex,0,frames[idx]); lastFrame = idx; }
    gl.uniform1f(uMode, 1); gl.uniform1f(uFoil, 0.15);
  } else {
    lastFrame = -1;
    gl.uniform1f(uMode, 0); gl.uniform1f(uFoil, +$("foil").value);
  }
  gl.uniform2f(uTilt, st.tilt.x, st.tilt.y); gl.uniform1f(uStr, +$("str").value);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
