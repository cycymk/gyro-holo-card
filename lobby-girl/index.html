<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lobby Girl Gyro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#17141c;--panel:rgba(24,20,30,.82);--line:rgba(255,255,255,.14);--fg:#f3eef8;--mute:#b5abc3;--accent:#ff8a5c;--cyan:#56d6e6;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* stage: everything that moves stays inside a clipped full-screen box, so nothing can widen the page */
.stage{position:fixed;inset:0;overflow:hidden}
.bgimg{position:absolute;inset:-8%;background:#c97a0c url(bg.jpg) center/cover no-repeat;will-change:transform;transition:opacity .3s}
body.nobg .bgimg{opacity:0}
.backdrop{position:absolute;inset:-8%;background:radial-gradient(60% 45% at 50% 42%,rgba(44,37,54,.7) 0%,rgba(23,20,28,0) 70%);will-change:transform}
/* canvas is 30% larger than the screen so the 3D turn never shows its edge */
canvas{position:absolute;left:-15%;top:-15%;width:130%;height:130%;display:block;will-change:transform}
.dim{position:absolute;inset:0;background:#05040a;opacity:.62;pointer-events:none;transition:opacity 1.6s ease}
body.awake .dim{opacity:0}
button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--cyan);border-color:var(--cyan);color:#082429;font-weight:700}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#2a0f04}
/* minimal layer: always present */
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:7px;font-size:12px;background:rgba(10,8,14,.45);border:1px solid var(--line);border-radius:999px;padding:5px 12px;z-index:5;transition:opacity .4s}
.pill i,.mode i{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
body:not(.awake) .pill i,body:not(.awake) .mode i{animation:breathe 3.2s ease-in-out infinite}
body.awake .pill i,body.awake .mode i{background:#6be38a}
body.booting .pill i,body.booting .mode i{background:#ffd166;animation:breathe .6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:1}}
body:not(.minimal) .pill{opacity:0;pointer-events:none}
.toast{position:fixed;left:max(14px,env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:11px;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.sub{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--uih,60px) + 14px + env(safe-area-inset-bottom));max-width:min(86vw,520px);background:rgba(10,8,14,.66);color:#fff;font-size:14px;line-height:1.5;padding:7px 14px;border-radius:10px;opacity:0;transition:opacity .3s,bottom .3s;pointer-events:none;z-index:6;text-align:center}
.sub.on{opacity:1}
/* interaction dock */
.ui{position:fixed;left:0;right:0;bottom:0;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px;z-index:5;transition:opacity .4s,transform .4s;box-sizing:border-box}
body.minimal .ui{opacity:0;transform:translateY(16px);pointer-events:none}
.dock{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;min-width:0}
.pwr{width:40px;height:40px;border-radius:50%;padding:0;font-size:17px;flex:none}
body.awake .pwr{background:var(--cyan);border-color:var(--cyan);color:#082429}
.mode{font-size:12px;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap}
.vol{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.vol input{flex:1;min-width:0;accent-color:var(--cyan)}
body:not(.awake) .vol{visibility:hidden}
.icon{width:40px;height:40px;border-radius:50%;padding:0;flex:none;font-size:16px}
.chat{display:none;flex-direction:column;gap:8px}
body.talk .chat{display:flex}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:12px;padding:5px 10px}
.chat form{display:flex;gap:6px}
.chat input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
/* settings sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(20,17,26,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));transform:translateY(105%);transition:transform .35s ease;max-height:75vh;overflow:auto;box-sizing:border-box;touch-action:pan-y}
body.settings .sheet{transform:none}
.sheet h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.sheet h3{font-size:11px;letter-spacing:.08em;color:var(--mute);margin:14px 0 8px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sheet label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg);margin:6px 0}
.sheet label span{width:3em;flex:none;color:var(--mute)}
.sheet label input{flex:1;min-width:0;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--mute);line-height:1.6;margin:4px 0 0}
.ripple{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--cyan);pointer-events:none;animation:rip .6s ease-out forwards;z-index:4}
.ripple.hit{border-color:var(--accent);box-shadow:0 0 18px var(--accent)}
.spark{position:fixed;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:4;animation:spark .55s ease-out forwards}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(6);opacity:0}}
@keyframes spark{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple,.spark{animation-duration:.01s}}
</style>
</head>
<body class="minimal">
<div class="stage" id="stage">
  <div class="bgimg" id="bgimg"></div>
  <div class="backdrop" id="backdrop"></div>
  <canvas id="c"></canvas>
  <div class="dim"></div>
</div>
<div class="toast" id="toast"></div>
<div class="sub" id="sub"></div>
<button class="pill" id="pill"><i></i><span id="modeTxt2">休眠待機 · 點一下喚出介面</span></button>
<div class="ui" id="ui">
  <div class="dock chat" id="chat">
    <div class="chips"><button data-q="妳在做什麼？">妳在做什麼？</button><button data-q="想聽歌">想聽歌</button><button data-q="妳是誰？">妳是誰？</button><button data-q="晚安">晚安</button></div>
    <form id="chatForm"><input id="chatIn" placeholder="跟她說話…" autocomplete="off" enterkeyhint="send"><button class="primary" type="submit">送出</button></form>
  </div>
  <div class="dock" id="dock">
    <button class="pwr" id="pwr" aria-label="開機或休眠">⏻</button>
    <div class="mode"><i></i><span id="modeTxt">休眠待機</span></div>
    <label class="vol" aria-label="音量">🔈<input id="vol" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <button class="icon" id="sense" aria-pressed="false" aria-label="鏡頭感應">◉</button>
    <button class="icon" id="setBtn" aria-label="設定">⚙</button>
  </div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-label="設定">
  <h2>設定 <button id="setClose">完成</button></h2>
  <h3>操作</h3>
  <p class="hint">單指拖曳：轉視角　雙指捏合：縮放　雙指拖曳：移動鏡頭　點兩下：放大／回全身　點角色部位：互動</p>
  <h3>感測</h3>
  <div class="row"><button class="primary" id="gyroBtn">啟用陀螺儀</button><button id="recal">陀螺儀歸零</button><button id="camReset">鏡頭回全身</button></div>
  <h3>畫面</h3>
  <div class="row"><button id="fs">全螢幕</button><button id="bgBtn" aria-pressed="true">背景</button><button id="dbg" aria-pressed="false">顯示部位</button><button id="st00" aria-pressed="true">00 Idle</button><button id="st10" aria-pressed="false">10 Idle</button></div>
  <h3>強度</h3>
  <label><span>視角</span><input id="depth" type="range" min="0" max="2" step="0.05" value="1"></label>
  <label><span>臉部</span><input id="face" type="range" min="0" max="2" step="0.05" value="0.6"></label>
  <label><span>擺動</span><input id="phys" type="range" min="0" max="2" step="0.05" value="0.6"></label>
  <h3>聲音</h3>
  <div class="row"><button id="voiceTgl" aria-pressed="true">角色語音</button><button id="autoMin" aria-pressed="true">閒置自動精簡</button></div>
  <p class="hint" id="status">陀螺儀未啟用</p>
</div>
<script src="spine-webgl.min.js"></script>
<script src="voice.js"></script>
<script src="interact.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const LG = window.LG = window.LG || {}; if (LG.rest == null) LG.rest = 0;
const canvas = $("c"), statusEl = $("status"), toastEl = $("toast");
const ctx = new spine.ManagedWebGLRenderingContext(canvas, { alpha: true, premultipliedAlpha: true });
const gl = ctx.gl;
const am = new spine.AssetManager(ctx);
am.loadBinary("girl.skel"); am.loadTextureAtlas("girl.atlas");

let DROPS = [], nextDrop = 2;
let skeleton, state, sd, renderer, shapes, faceCtrl, lookEntry;
const tilt = { x: 0, y: 0 }, gyro = { x: 0, y: 0 }, drag = { x: 0, y: 0 };
let gyroBase = null, gyroRaw = null, gyroOn = false, idleState = "00_Idle_ani", busy = false, showParts = false;

// ---- part groups (slot name → group) ----
const GROUPS = [
  { key: "head", label: "頭部", test: n => /^(Face|Hair|eye|pupil|eyelash|close eye|eyebrow|eyeLight|eyewhite|eyepupil|mouth|teeth|Neck)/i.test(n) },
  { key: "arm",  label: "手臂", test: n => /(Arm|arm_r1|finger)/i.test(n) },
  { key: "leg",  label: "腿",   test: n => /(thigh|calf)/i.test(n) },
  { key: "body", label: "身體", test: n => /(Body|Breast|shadow)/i.test(n) },
];
const groupOf = n => (GROUPS.find(g => g.test(n)) || { key: "other", label: "其他" });

function init() {
  const atlas = am.require("girl.atlas");
  const bin = new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(atlas));
  sd = bin.readSkeletonData(am.require("girl.skel"));
  skeleton = new spine.Skeleton(sd);
  skeleton.setToSetupPose();
  skeleton.updateWorldTransform(spine.Physics.reset);

  const asd = new spine.AnimationStateData(sd); asd.defaultMix = 0.25;
  state = new spine.AnimationState(asd);
  state.setAnimation(0, idleState, true);
  lookEntry = state.setAnimation(2, "02_Look_ani", false); lookEntry.timeScale = 0; lookEntry.mixDuration = 0;
  scheduleBlink();

  faceCtrl = skeleton.findBone("Face_CTRL_1");
  DROPS = [["arm_oil_D1", "B_Arm_r_oil_D", 110], ["arm_oil_D2", "B_Arm_r_oil_D2", 90], ["leg_oil_D1", "B_thigh_R_oil", 120], ["leg_oil_D2", "B_thigh_R_oil_drop", 150]]
    .map(([b, sl, dist]) => ({ bone: skeleton.findBone(b), slot: skeleton.findSlot(sl), dist, t: -1 }));

  renderer = new spine.SceneRenderer(canvas, ctx, true);
  shapes = renderer.shapes;
  resize(); addEventListener("resize", () => { resize(); clampCam(camT); }); clampCam(camT); Object.assign(cam, camT);
  requestAnimationFrame(loop);
}

let DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 1.75);
  canvas.width = Math.round(canvas.clientWidth * DPR); canvas.height = Math.round(canvas.clientHeight * DPR);
  gl.viewport(0, 0, canvas.width, canvas.height);
}

// ---- animations ----
function scheduleBlink() { setTimeout(() => { if (state && LG.rest < 0.2) { const e = state.setAnimation(1, "01_Eye_ani", false); e.mixDuration = 0.1; state.addEmptyAnimation(1, 0.2, 0); } scheduleBlink(); }, 2500 + Math.random() * 3500); }
function playActive() {
  if (busy) return; busy = true;
  state.setAnimation(0, "20_Active_ani", false);
  const e = state.addAnimation(0, idleState, true, 0);
  e.listener = { start: () => { busy = false; } };
}
function setIdle(name) {
  idleState = name; $("st00").setAttribute("aria-pressed", name === "00_Idle_ani"); $("st10").setAttribute("aria-pressed", name === "10_Idle_ani");
  if (!busy) state.setAnimation(0, name, true);
}
$("st00").onclick = () => setIdle("00_Idle_ani");
$("st10").onclick = () => setIdle("10_Idle_ani");
$("dbg").onclick = () => { showParts = !showParts; $("dbg").setAttribute("aria-pressed", showParts); };

// ---- UI layers: minimal (just her) / dock / settings; idle → minimal ----
let idleT;
LG.minimalLock = false; // interact.js sets this in listen mode
function setMinimal(on) { document.body.classList.toggle("minimal", on); updateSubPos(); }
function updateSubPos() { document.body.style.setProperty("--uih", (document.body.classList.contains("minimal") ? 40 : $("ui").offsetHeight - 10) + "px"); }
LG.poke = () => {
  if (LG.minimalLock) return;
  setMinimal(false); clearTimeout(idleT);
  if ($("autoMin").getAttribute("aria-pressed") === "true") idleT = setTimeout(() => { if (!document.body.classList.contains("settings") && !document.body.classList.contains("talk")) setMinimal(true); }, 8000);
};
LG.setMinimal = setMinimal;
document.addEventListener("pointerdown", e => { if (!e.target.closest("canvas")) LG.poke(); }, true);
$("pill").onclick = () => LG.poke();
$("setBtn").onclick = () => { document.body.classList.add("settings"); clearTimeout(idleT); };
$("setClose").onclick = () => { document.body.classList.remove("settings"); LG.poke(); };
$("autoMin").onclick = () => { const on = $("autoMin").getAttribute("aria-pressed") !== "true"; $("autoMin").setAttribute("aria-pressed", on); LG.poke(); };
new ResizeObserver(updateSubPos).observe($("ui"));

let toastT;
function toast(t) { toastEl.textContent = t; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), 900); }

function onPart(g, wx, wy) {
  if (LG.onPart && LG.onPart(g) === false) return;
  const k = +$("phys").value;
  if (g.key === "head") { const e = state.setAnimation(1, "01_Eye_ani", false); e.mixDuration = 0.05; state.addEmptyAnimation(1, 0.2, 0); skeleton.physicsTranslate(40 * k, 25 * k); toast("頭部：眨眼 + 甩髮"); }
  else if (g.key === "arm") { playActive(); toast("手臂：20_Active"); }
  else if (g.key === "leg") { setIdle(idleState === "00_Idle_ani" ? "10_Idle_ani" : "00_Idle_ani"); toast("腿：切換 " + idleState.slice(0, 7)); }
  else if (g.key === "body") { playActive(); skeleton.physicsTranslate(0, -30 * k); toast("身體：20_Active"); }
}

// ---- camera: pinch to zoom, two-finger pan, double tap toggles ----
// B = the whole character; the view never goes below the seat cushion (FLOOR) and zoom 1 always shows all of her
const B = { x0: -650, x1: 550, y0: -320, y1: 1590 };
const cam = { z: 1, cx: (B.x0 + B.x1) / 2, cy: (B.y0 + B.y1) / 2 }, camT = { ...cam };
let viewS = 1;
function baseScale() { const W = innerWidth * DPR, H = innerHeight * DPR; return Math.min(W / (B.x1 - B.x0), H / (B.y1 - B.y0)); }
function clampCam(c) {
  c.z = Math.max(1, Math.min(4, c.z));
  const s = baseScale() * c.z, hw = innerWidth * DPR / 2 / s, hh = innerHeight * DPR / 2 / s;
  c.cx = hw * 2 >= B.x1 - B.x0 ? (B.x0 + B.x1) / 2 : Math.max(B.x0 + hw, Math.min(B.x1 - hw, c.cx));
  c.cy = hh * 2 >= B.y1 - B.y0 ? B.y0 + hh : Math.max(B.y0 + hh, Math.min(B.y1 - hh, c.cy));
  return c;
}
function zoomAt(px, py, z) { // keep the world point under (px,py) fixed while zooming
  const w = screenToWorld(px, py, camT); camT.z = z; const s = baseScale() * camT.z;
  camT.cx = w.x - (px - innerWidth / 2) * DPR / s; camT.cy = w.y + (py - innerHeight / 2) * DPR / s; clampCam(camT);
}
function resetCam() { camT.z = 1; clampCam(camT); }
function screenToWorld(px, py, c = cam) {
  const s = baseScale() * c.z;
  return { x: c.cx + (px - innerWidth / 2) * DPR / s, y: c.cy - (py - innerHeight / 2) * DPR / s };
}
$("camReset").onclick = resetCam;

// ---- hit test ----
const verts = new Float32Array(20000);
function hitSlot(wx, wy) {
  const order = skeleton.drawOrder;
  for (let i = order.length - 1; i >= 0; i--) {
    const slot = order[i], a = slot.getAttachment();
    if (!a || !a.triangles || slot.color.a === 0) continue;
    const n = a.worldVerticesLength; a.computeWorldVertices(slot, 0, n, verts, 0, 2);
    const t = a.triangles;
    for (let j = 0; j < t.length; j += 3) {
      const ax = verts[t[j]*2], ay = verts[t[j]*2+1], bx = verts[t[j+1]*2], by = verts[t[j+1]*2+1], cx = verts[t[j+2]*2], cy = verts[t[j+2]*2+1];
      const d1 = (wx-bx)*(ay-by)-(ax-bx)*(wy-by), d2 = (wx-cx)*(by-cy)-(bx-cx)*(wy-cy), d3 = (wx-ax)*(cy-ay)-(cx-ax)*(wy-ay);
      if (!(((d1<0)||(d2<0)||(d3<0)) && ((d1>0)||(d2>0)||(d3>0)))) {
        // ignore fully transparent texels is costly; accept triangle hit
        return slot;
      }
    }
  }
  return null;
}

// ---- input ----
const ptrs = new Map();
let down = null, last = null, multi = false, pinch = null, lastTap = { t: 0, x: 0, y: 0 };
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  LG.poke && LG.poke();
  if (ptrs.size === 1) { down = { x: e.clientX, y: e.clientY, t: performance.now() }; last = { ...down }; multi = false; }
  if (ptrs.size === 2) { multi = true; pinch = pinchInfo(); }
});
function pinchInfo() { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
canvas.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size >= 2 && pinch) {
    const p = pinchInfo(), s = baseScale() * camT.z;
    zoomAt(p.mx, p.my, camT.z * p.d / Math.max(1, pinch.d));
    camT.cx -= (p.mx - pinch.mx) * DPR / s; camT.cy += (p.my - pinch.my) * DPR / s; clampCam(camT);
    pinch = p; return;
  }
  if (!down || multi) return;
  const dx = (e.clientX - last.x) / innerWidth, dy = (e.clientY - last.y) / innerHeight; last = { x: e.clientX, y: e.clientY };
  drag.x = Math.max(-1.6, Math.min(1.6, drag.x + dx * 3)); drag.y = Math.max(-1.6, Math.min(1.6, drag.y + dy * 3));
});
function feedback(x, y, hit) {
  const r = document.createElement("div"); r.className = "ripple" + (hit ? " hit" : ""); r.style.left = x + "px"; r.style.top = y + "px";
  document.body.appendChild(r); setTimeout(() => r.remove(), 650);
  if (hit) {
    for (let i = 0; i < 8; i++) { const sp = document.createElement("div"), a = i / 8 * Math.PI * 2 + Math.random() * 0.4, d = 30 + Math.random() * 26;
      sp.className = "spark"; sp.style.left = x + "px"; sp.style.top = y + "px"; sp.style.setProperty("--dx", Math.cos(a) * d + "px"); sp.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(sp); setTimeout(() => sp.remove(), 600); }
    bounce = 0.975;
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  }
}
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size > 0) return;
  if (down && !multi && e.type === "pointerup") {
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
    if (moved < 10 && dt < 400) {
      const now = performance.now();
      if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { // double tap
        if (camT.z > 1.2) resetCam(); else zoomAt(e.clientX, e.clientY, 2.4);
        lastTap.t = 0;
      } else {
        lastTap = { t: now, x: e.clientX, y: e.clientY };
        const w = screenToWorld(e.clientX, e.clientY), slot = hitSlot(w.x, w.y), g = slot ? groupOf(slot.data.name) : null;
        feedback(e.clientX, e.clientY, !!(g && g.key !== "other"));
        if (g) onPart(g, w.x, w.y);
      }
    }
  }
  down = null;
}
canvas.addEventListener("pointerup", endPtr);
canvas.addEventListener("pointercancel", endPtr);

function onOrient(e) {
  if (e.gamma == null) return;
  gyroRaw = { g: e.gamma, b: e.beta };
  if (!gyroBase) gyroBase = { ...gyroRaw };
  const c = v => Math.max(-1.4, Math.min(1.4, v));
  gyro.x = c((e.gamma - gyroBase.g) / 20); gyro.y = c((e.beta - gyroBase.b) / 20);
  if (!gyroOn) { gyroOn = true; statusEl.textContent = "陀螺儀已啟用"; $("gyroBtn").textContent = "陀螺儀已啟用"; }
}
$("gyroBtn").onclick = async () => {
  try {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
      if (await DeviceOrientationEvent.requestPermission() !== "granted") { statusEl.textContent = "未允許動作感測"; return; }
    }
    addEventListener("deviceorientation", onOrient);
    statusEl.textContent = "等待感測器…";
    setTimeout(() => { if (!gyroOn) statusEl.textContent = "讀不到陀螺儀（需要 HTTPS 和手機）"; }, 1500);
  } catch (err) { statusEl.textContent = "讀不到陀螺儀"; }
};
const backdrop = $("backdrop"), bgimg = $("bgimg");
$("bgBtn").onclick = () => { const on = document.body.classList.toggle("nobg"); $("bgBtn").setAttribute("aria-pressed", !on); };
$("fs").onclick = () => {
  const el = document.documentElement;
  try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el)?.catch?.(() => toast("這個瀏覽器不支援全螢幕，可加入主畫面")); }
  catch (e) { toast("這個瀏覽器不支援全螢幕，可加入主畫面"); }
};
$("recal").onclick = () => { gyroBase = gyroRaw ? { ...gyroRaw } : null; drag.x = drag.y = 0; };

// ---- loop ----
let lastT = performance.now(), prevTilt = { x: 0, y: 0 }, bounce = 1;
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!down) { drag.x *= 0.92; drag.y *= 0.92; }
  const tx = gyro.x + drag.x, ty = gyro.y + drag.y;
  tilt.x += (tx - tilt.x) * 0.16; tilt.y += (ty - tilt.y) * 0.16;

  // eyes follow the viewer slightly: scrub the look animation by tilt
  if (lookEntry) lookEntry.trackTime = Math.max(0, Math.min(1, 0.5 + tilt.x * 0.45)) * lookEntry.animationEnd * 0.999;

  // physics only reacts to the change of tilt, kept gentle
  const pk = +$("phys").value;
  skeleton.physicsTranslate((tilt.x - prevTilt.x) * -120 * pk, (tilt.y - prevTilt.y) * 70 * pk);
  prevTilt = { x: tilt.x, y: tilt.y };

  const rest = LG.rest;
  state.update(dt * (1 - 0.75 * rest)); state.apply(skeleton);
  // sleep pose: eyes shut, upper body bows forward (blended by LG.rest 0..1)
  if (rest > 0.001) {
    sd.findAnimation("01_Eye_ani").apply(skeleton, 0, 1.5, false, null, rest, spine.MixBlend.replace, spine.MixDirection.mixIn);
    skeleton.findBone("body2").rotation -= 8 * rest; skeleton.findBone("neck").rotation -= 10 * rest; skeleton.findBone("head").rotation -= 12 * rest;
  }
  // head faces the viewer through the rig's own Face_CTRL_1 (world offset -> parent local)
  const vk = +$("depth").value;
  // face turns less than the view and is clamped so it never over-rotates
  const fk = +$("face").value, fx = Math.max(-1, Math.min(1, tilt.x)), fy = Math.max(-1, Math.min(1, tilt.y));
  if (faceCtrl && faceCtrl.parent) {
    const p = faceCtrl.parent, a = new spine.Vector2(faceCtrl.worldX, faceCtrl.worldY), b = new spine.Vector2(faceCtrl.worldX + fx * 150 * fk, faceCtrl.worldY - fy * 90 * fk);
    p.worldToLocal(a); p.worldToLocal(b); faceCtrl.x += b.x - a.x; faceCtrl.y += b.y - a.y;
  }
  // liquid drops: every few seconds one streak runs down, fades, then grows back
  nextDrop -= dt;
  if (nextDrop <= 0) { const idle = DROPS.filter(d => d.t < 0); if (idle.length) idle[Math.random() * idle.length | 0].t = 0; nextDrop = 2.5 + Math.random() * 3.5; }
  for (const d of DROPS) {
    if (!d.bone || !d.slot) continue;
    let off = 0, alpha = 1;
    if (d.t >= 0) {
      d.t += dt; const T = 2.6;
      const k = Math.min(1, d.t / 1.8); off = d.dist * (k * k * (3 - 2 * k));          // run down
      if (d.t > 1.8) alpha = Math.max(0, 1 - (d.t - 1.8) / 0.5);                     // fade at the end
      if (d.t > T) { d.t = -1; d.grow = 0; }
    } else if (d.grow !== undefined && d.grow < 1) { d.grow = Math.min(1, d.grow + dt / 0.8); alpha = d.grow; }
    const p = d.bone.parent;
    const w0 = new spine.Vector2(p.worldX, p.worldY), w1 = new spine.Vector2(p.worldX, p.worldY - off);
    p.worldToLocal(w0); p.worldToLocal(w1);
    d.bone.x = d.bone.data.x + (w1.x - w0.x); d.bone.y = d.bone.data.y + (w1.y - w0.y);
    d.slot.color.a = alpha;
  }
  skeleton.update(dt);
  skeleton.updateWorldTransform(spine.Physics.update);

  // viewpoint: the whole character turns rigidly, the backdrop slides the other way
  canvas.style.transform = `perspective(1100px) rotateY(${tilt.x * 20 * vk}deg) rotateX(${-tilt.y * 10 * vk}deg) translate3d(${tilt.x * 14 * vk}px, 0, 0) scale(${bounce})`;
  bounce += (1 - bounce) * 0.2;
  backdrop.style.transform = `translate(${-tilt.x * 60 * vk}px, ${-tilt.y * 36 * vk}px)`;
  bgimg.style.transform = `translate(${-tilt.x * 45 * vk}px, ${-tilt.y * 28 * vk}px)`;

  // camera (smoothly follows the gesture target)
  for (const k of ["z", "cx", "cy"]) cam[k] += (camT[k] - cam[k]) * 0.22;
  viewS = baseScale() * cam.z;
  const rc = renderer.camera; rc.setViewport(canvas.width, canvas.height);
  rc.zoom = 1 / viewS; rc.position.x = cam.cx; rc.position.y = cam.cy;

  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  renderer.begin();
  renderer.drawSkeleton(skeleton, true);
  if (showParts) {
    renderer.end(); renderer.begin();
    const cols = { head: [0.34, 0.84, 0.9], arm: [1, 0.54, 0.36], leg: [0.6, 0.9, 0.4], body: [0.9, 0.5, 0.9], other: [0.7, 0.7, 0.7] };
    for (const slot of skeleton.drawOrder) {
      const a = slot.getAttachment(); if (!a || !a.triangles) continue;
      const g = groupOf(slot.data.name).key, c = cols[g];
      a.computeWorldVertices(slot, 0, a.worldVerticesLength, verts, 0, 2);
      const col = new spine.Color(c[0], c[1], c[2], 0.5);
      const h = a.hullLength; for (let j = 0; j < h; j += 2) { const k2 = (j + 2) % h; renderer.line(verts[j], verts[j+1], verts[k2], verts[k2+1], col); }
    }
  }
  renderer.end();
  requestAnimationFrame(loop);
}

(function wait() {
  if (am.hasErrors()) { statusEl.textContent = "素材載入失敗：" + JSON.stringify(am.getErrors()); return; }
  if (!am.isLoadingComplete()) return setTimeout(wait, 50);
  init();
  Object.assign(LG, { toast, resetCam, playActive, physics: (x, y) => skeleton.physicsTranslate(x, y), tilt });
  LG.ready && LG.ready();
})();
})();
</script>
</body>
</html>
