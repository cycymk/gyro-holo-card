<style>
:root{--bg:#17141c;--bb0:calc(env(safe-area-inset-bottom) + 4px + var(--tb,0px));--panel:rgba(16,12,20,.2);--bb:calc(env(safe-area-inset-bottom) + 12px + var(--tb,0px));--line:rgba(255,255,255,.14);--fg:#f3eef8;--mute:#b5abc3;--accent:#ff8a5c;--cyan:#56d6e6;color-scheme:dark}

html.rot body{position:fixed;left:0;top:0;transform-origin:0 0}

html,body{background:#a8650c;color:var(--fg);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* stage: everything that moves stays inside a clipped full-screen box, so nothing can widen the page */
.stage{position:fixed;z-index:0;isolation:isolate;left:0;top:0;width:100%;height:100vh;height:calc(100lvh + env(safe-area-inset-bottom));overflow:hidden;background:#a8650c}

.backdrop{position:absolute;inset:-8%;background:radial-gradient(60% 45% at 50% 42%,rgba(44,37,54,.7) 0%,rgba(23,20,28,0) 70%);will-change:transform}
/* canvas is 30% larger than the screen so the 3D turn never shows its edge */

.toast.on{opacity:1}
.sub{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(var(--bb) + var(--chath,0px) + 8px);max-width:min(86vw,520px);width:max-content;box-sizing:border-box;background:rgba(10,8,14,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:14px;line-height:1.5;padding:7px 14px;border-radius:10px;opacity:0;transition:opacity .3s,transform .3s,bottom .35s;pointer-events:none;z-index:6;text-align:center}

.dock{background:var(--panel);backdrop-filter:blur(6px) saturate(1.1);-webkit-backdrop-filter:blur(6px) saturate(1.1);text-shadow:0 1px 3px rgba(0,0,0,.55);border:1px solid var(--line);border-radius:999px;padding:5px;display:flex;gap:6px;align-items:center;min-width:0;box-shadow:none;border-color:rgba(255,255,255,.1)}

.dim{transition:opacity 3s ease}

@property --p{syntax:"<percentage>";inherits:false;initial-value:0%}
@keyframes holdp{to{--p:100%}}
.fxp{position:fixed;pointer-events:none;z-index:6;font-size:24px;line-height:1;animation:fxup 1.3s ease-out forwards;text-shadow:0 0 8px rgba(255,255,255,.7)}
@keyframes fxup{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% - 70px)) scale(1.2);opacity:0}}
body.angry .stage{filter:saturate(1.2) sepia(.25) hue-rotate(-20deg)}
.shots{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:calc(var(--bb0) + var(--chath,0px) + 10px);display:flex;flex-direction:column;gap:6px;z-index:5;padding:4px;border-radius:999px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),bottom .35s ease}

@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(6);opacity:0}}
@keyframes spark{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple,.spark{animation-duration:.01s}}
</style>

<script>
(() => {
const $ = id => document.getElementById(id);
const LG = window.LG = window.LG || {}; if (LG.rest == null) LG.rest = 0;
const stageEl = $("stage"), VH = () => stageEl.clientHeight || innerHeight, VW = () => stageEl.clientWidth || innerWidth;
// ---- portrait lock: browsers (esp. iOS) can't lock rotation, so when the phone turns sideways we counter-rotate the whole page ----
let rotA = 0;
function applyPortraitLock() {
  const de = document.documentElement, bs = document.body.style;
  const a = typeof window.orientation === "number" ? window.orientation : screen.orientation ? (screen.orientation.angle > 180 ? screen.orientation.angle - 360 : screen.orientation.angle) : 0;
  const W = innerWidth, H = innerHeight;
  rotA = W > H && (a === 90 || a === -90) ? a : 0;
  de.classList.toggle("rot", !!rotA);
  if (!rotA) { bs.width = bs.height = bs.transform = ""; return; }
  bs.width = H + "px"; bs.height = W + "px";
  bs.transform = rotA === 90 ? `translate(0px, ${H}px) rotate(-90deg)` : `translate(${W}px, 0px) rotate(90deg)`;
}
// screen point → page point (inverse of the counter-rotation)
const PX = e => rotA === 90 ? innerHeight - e.clientY : rotA === -90 ? e.clientY : e.clientX;
const PY = e => rotA === 90 ? e.clientX : rotA === -90 ? innerWidth - e.clientX : e.clientY;
applyPortraitLock();
addEventListener("resize", applyPortraitLock); addEventListener("orientationchange", () => setTimeout(() => { applyPortraitLock(); dispatchEvent(new Event("resize")); }, 60));
const tryLock = () => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock("portrait").catch(() => {}); } catch (e) {} };
addEventListener("click", tryLock, { once: true }); document.addEventListener("fullscreenchange", tryLock);
const canvas = $("c"), statusEl = $("status"), toastEl = $("toast");
const ctx = new spine.ManagedWebGLRenderingContext(canvas, { alpha: true, premultipliedAlpha: true });
const gl = ctx.gl;
const am = new spine.AssetManager(ctx);
am.loadBinary("girl.skel"); am.loadTextureAtlas("girl.atlas");

let DROPS = [], nextDrop = 2;
let skeleton, state, sd, renderer, shapes, faceCtrl, lookEntry;
const tilt = { x: 0, y: 0 }, gyro = { x: 0, y: 0 }, drag = { x: 0, y: 0 };
let gyroBase = null, gyroRaw = null, gyroOn = false, idleState = "00_Idle_ani", busy = false, showParts = false;

// ---- part groups (slot name → group) ----
const GROUPS = [
  { key: "head", label: "頭部", test: n => /^(Face|Hair|eye|pupil|eyelash|close eye|eyebrow|eyeLight|eyewhite|eyepupil|mouth|teeth|Neck)/i.test(n) },
  { key: "arm",  label: "手臂", test: n => /(Arm|arm_r1|finger)/i.test(n) },
  { key: "leg",  label: "腿",   test: n => /(thigh|calf)/i.test(n) },
  { key: "body", label: "身體", test: n => /(Body|Breast|shadow)/i.test(n) },
];
const groupOf = n => (GROUPS.find(g => g.test(n)) || { key: "other", label: "其他" });

function init() {
  const atlas = am.require("girl.atlas");
  const bin = new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(atlas));
  sd = bin.readSkeletonData(am.require("girl.skel"));
  skeleton = new spine.Skeleton(sd);
  skeleton.setToSetupPose();
  skeleton.updateWorldTransform(spine.Physics.reset);

  const asd = new spine.AnimationStateData(sd); asd.defaultMix = 0.25;
  state = new spine.AnimationState(asd);
  state.setAnimation(0, idleState, true);
  lookEntry = state.setAnimation(2, "02_Look_ani", false); lookEntry.timeScale = 0; lookEntry.mixDuration = 0;
  scheduleBlink();

  faceCtrl = skeleton.findBone("Face_CTRL_1");
  DROPS = [["arm_oil_D1", "B_Arm_r_oil_D", 110], ["arm_oil_D2", "B_Arm_r_oil_D2", 90], ["leg_oil_D1", "B_thigh_R_oil", 120], ["leg_oil_D2", "B_thigh_R_oil_drop", 150]]
    .map(([b, sl, dist]) => ({ bone: skeleton.findBone(b), slot: skeleton.findSlot(sl), dist, t: -1 }));

  renderer = new spine.SceneRenderer(canvas, ctx, true);
  shapes = renderer.shapes;
  resize(); addEventListener("resize", () => { resize(); clampCam(camT); }); Object.assign(camT, SHOT.sleep); clampCam(camT); Object.assign(cam, camT);
  requestAnimationFrame(loop);
}

let DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 1.75);
  canvas.width = Math.round(canvas.clientWidth * DPR); canvas.height = Math.round(canvas.clientHeight * DPR);
  gl.viewport(0, 0, canvas.width, canvas.height);
}

// ---- animations ----
function scheduleBlink() { setTimeout(() => { if (state && LG.rest < 0.2) { const e = state.setAnimation(1, "01_Eye_ani", false); e.mixDuration = 0.1; state.addEmptyAnimation(1, 0.2, 0); } scheduleBlink(); }, 2500 + Math.random() * 3500); }
let actAt = 0, kickAt = 0, idleAt = 0;
function canAct(gap) { const n = performance.now(); if (n - actAt < gap) return false; actAt = n; return true; }
function kick(x, y) { const n = performance.now(); if (n - kickAt < 1200) return; kickAt = n; skeleton.physicsTranslate(x, y); }

    if (d.t >= 0) {
      d.t += dt; const T = 2.6;
      const k = Math.min(1, d.t / 1.8); off = d.dist * (k * k * (3 - 2 * k));          // run down
      if (d.t > 1.8) alpha = Math.max(0, 1 - (d.t - 1.8) / 0.5);                     // fade at the end
      if (d.t > T) { d.t = -1; d.grow = 0; }
    } else if (d.grow !== undefined && d.grow < 1) { d.grow = Math.min(1, d.grow + dt / 0.8); alpha = d.grow; }
    const p = d.bone.parent;
    const w0 = new spine.Vector2(p.worldX, p.worldY), w1 = new spine.Vector2(p.worldX, p.worldY - off);
    p.worldToLocal(w0); p.worldToLocal(w1);
    d.bone.x = d.bone.data.x + (w1.x - w0.x); d.bone.y = d.bone.data.y + (w1.y - w0.y);
    d.slot.color.a = alpha;
  }
  skeleton.update(dt);
  skeleton.updateWorldTransform(spine.Physics.update);

  // viewpoint: the whole character turns rigidly, the backdrop slides the other way
  canvas.style.transform = `perspective(1100px) rotateY(${tilt.x * 20 * vk}deg) rotateX(${-tilt.y * 10 * vk}deg) translate3d(${tilt.x * 14 * vk}px, 0, 0) scale(${bounce})`;
  bounce += (1 - bounce) * 0.2;
  const lim = Math.min(VW(), VH()) * 0.11, cl = v => Math.max(-lim, Math.min(lim, v));
  bgimg.style.transform = `translate3d(${cl(-tilt.x * 45 * vk)}px, ${cl(-tilt.y * 28 * vk)}px, 0)`;

  // camera (smoothly follows the gesture target)
  camEase += ((ptrs.size ? 0.22 : camEaseT) - camEase) * 0.1;
  for (const k of ["z", "cx", "cy"]) cam[k] += (camT[k] - cam[k]) * camEase;
  viewS = baseScale() * cam.z;
  const rc = renderer.camera; rc.setViewport(canvas.width, canvas.height);
  rc.zoom = 1 / viewS; rc.position.x = cam.cx; rc.position.y = cam.cy;

  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  renderer.begin();
  renderer.drawSkeleton(skeleton, true);
  if (showParts) {
    renderer.end(); renderer.begin();
    const cols = { head: [0.34, 0.84, 0.9], arm: [1, 0.54, 0.36], leg: [0.6, 0.9, 0.4], body: [0.9, 0.5, 0.9], other: [0.7, 0.7, 0.7] };
    for (const slot of skeleton.drawOrder) {
      const a = slot.getAttachment(); if (!a || !a.triangles) continue;
      const g = groupOf(slot.data.name).key, c = cols[g];
      a.computeWorldVertices(slot, 0, a.worldVerticesLength, verts, 0, 2);
      const col = new spine.Color(c[0], c[1], c[2], 0.5);
      const h = a.hullLength; for (let j = 0; j < h; j += 2) { const k2 = (j + 2) % h; renderer.line(verts[j], verts[j+1], verts[k2], verts[k2+1], col); }
    }
  }
  renderer.end();
  requestAnimationFrame(loop);
}

(function wait() {
  if (am.hasErrors()) { statusEl.textContent = "素材載入失敗：" + JSON.stringify(am.getErrors()); return; }
  if (!am.isLoadingComplete()) return setTimeout(wait, 50);
  init();
  Object.assign(LG, { toast, resetCam, playActive, physics: (x, y) => skeleton.physicsTranslate(x, y), tilt, slotBox: re => skeleton.slots.filter(sl => re.test(sl.data.name) && sl.getAttachment() && sl.getAttachment().computeWorldVertices).map(sl => { const a = sl.getAttachment(), n = a.worldVerticesLength, v = new Float32Array(n); a.computeWorldVertices(sl, 0, n, v, 0, 2); let ys = [], xs = []; for (let i = 0; i < n; i += 2) { xs.push(v[i]); ys.push(v[i + 1]); } return sl.data.name + ":" + Math.round(Math.min(...xs)) + ".." + Math.round(Math.max(...xs)) + "/" + Math.round(Math.min(...ys)) + ".." + Math.round(Math.max(...ys)); }).join("  "), boneInfo: () => skeleton.bones.filter(b => /head|neck|breast|body|thigh|calf|knee|hip|pelvis|foot/i.test(b.data.name)).map(b => b.data.name + ":" + Math.round(b.worldX) + "," + Math.round(b.worldY)).join(" ") });
  LG.ready && LG.ready();
})();
})();
</script>
